[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../node_modules"]
allow_paths = ["../node_modules"]
fs_permissions = [{ access = "read", path = "./core-out" }]
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=../node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=../node_modules/@uniswap/v4-periphery/",
  "solmate/=../node_modules/@uniswap/v4-core/lib/solmate/"
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

# These compiler/EVM settings are for local Anvil tests, not verified Zero settings.

# Canonical v4 PoolManager pins 0.8.26. Its untouched source is compiled separately
# for real-protocol local tests; oneshot's contracts retain the 0.8.30 profile.
[profile.v4_core]
src = "core-test-source"
test = "core-test-source/no-tests"
out = "core-out"
cache_path = "core-cache"
solc_version = "0.8.26"
optimizer_runs = 200
