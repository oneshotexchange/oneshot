name: oneshot-local

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      # Disposable loopback development credentials. Never use in production.
      POSTGRES_USER: oneshot_local_admin
      POSTGRES_PASSWORD: oneshot_local_admin_only
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:${ONESHOT_LOCAL_DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/10-oneshot-local.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U oneshot_local_admin -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB]
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

volumes:
  postgres_data:
