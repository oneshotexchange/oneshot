[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../node_modules"]
allow_paths = ["../node_modules"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

# These compiler/EVM settings are for local Anvil tests, not verified Zero settings.
